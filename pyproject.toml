[project]
name = "markserve"
version = "0.1.0"
description = "Browse and preview local Markdown files in your browser."
authors = [
    { name = "Uragami Taichi", email = "backpaper0@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py>=3.0.0",
    "pathspec>=0.12.1",
    "pygments>=2.18.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
markserve = "markserve.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
exclude-newer = "14 days"

