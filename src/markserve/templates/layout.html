<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} - markserve</title>
<link rel="stylesheet" href="/__markserve_static__/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="app-header__inner">
      <a class="brand" href="/">markserve</a>
      <nav class="breadcrumb">
        <a href="/">root</a>
        {% for crumb in breadcrumbs %}
          <span class="breadcrumb__sep">/</span>
          <a href="/{{ crumb.href }}">{{ crumb.name }}</a>
        {% endfor %}
      </nav>
      {% if is_markdown %}
      <div class="view-toggle">
        <a class="pill{% if not raw_mode %} pill--active{% endif %}" href="?">プレビュー</a>
        <a class="pill{% if raw_mode %} pill--active{% endif %}" href="?raw=1">ソース表示</a>
      </div>
      {% endif %}
    </div>
  </header>
  <div class="app-body">
    <details class="sidebar-wrapper" open>
      <summary class="sidebar-wrapper__label"><span class="tree-icon">📁</span>ファイル一覧</summary>
      <div class="sidebar card">
        {% if tree_truncated %}
        <p class="sidebar__notice">ファイル数が多いため一部を省略しています</p>
        {% endif %}
        {% from "_tree.html" import render_node %}
        {{ render_node(tree_root) }}
      </div>
    </details>
    <main class="main">
      {{ content | safe }}
    </main>
  </div>
</div>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: "neutral" });
</script>
</body>
</html>
